  <text class="l l6" x="28" y="196" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3" xml:space="preserve"><tspan fill="#FFC452" font-weight="700">planner </tspan><tspan fill="#6E7681">→ </tspan>add_task(title="Review authentication flow") → task_01</text>
  <text class="l l7" x="28" y="218" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3" xml:space="preserve"><tspan fill="#F7820E" font-weight="700">builder </tspan><tspan fill="#6E7681">→ </tspan>claim_task(taskId=task_01)</text>
