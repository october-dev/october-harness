  <text class="l l10" x="28" y="284" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3" xml:space="preserve"><tspan fill="#F7820E" font-weight="700">builder </tspan><tspan fill="#6E7681">→ </tspan>acknowledge_messages(messageIds=[msg_01])</text>
