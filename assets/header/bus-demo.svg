  <text x="440" y="23" text-anchor="middle" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E">planner · builder — one October Bus scope</text>
  <text class="l l0" x="28" y="64" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3" xml:space="preserve"><tspan fill="#FFC452" font-weight="700">planner </tspan><tspan fill="#6E7681">→ </tspan>list_peers()</text>
  <text class="l l1" x="28" y="86" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3" xml:space="preserve"><tspan fill="#BE400C" font-weight="700">bus     </tspan><tspan fill="#6E7681">→ </tspan>builder [attached, ready, local]</text>
