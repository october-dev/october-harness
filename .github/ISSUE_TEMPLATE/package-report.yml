name: Extension or Package Report
description: Report a third-party package presented as compatible with October Harness
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a third-party extension or package that claims compatibility with October Harness. For a Harness bug, use the bug report form. For a vulnerability in October-owned code, submit a private [security advisory](https://github.com/october-dev/october-harness/security/advisories/new).

        Read [CONTRIBUTING.md](https://github.com/october-dev/october-harness/blob/main/CONTRIBUTING.md) before submitting. New issues from new contributors are auto-closed by default. Maintainers review auto-closed issues and reopen worthwhile ones.

        Keep this short. If it doesn't fit on one screen, it's too long. Write in your own voice.

  - type: input
    id: package-name
    attributes:
      label: Package name
      description: The npm package name or repository URL.
      placeholder: "@scope/package"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version
      description: The affected package version.
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Malicious or unsafe behavior
        - Impersonation
        - False compatibility claim
        - Trademark or terms-of-service violation
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern and include links, logs, or screenshots if helpful.
    validations:
      required: true
