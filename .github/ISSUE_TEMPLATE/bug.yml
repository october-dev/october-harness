name: Bug Report
description: Report something that's broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** Read [CONTRIBUTING.md](https://github.com/october-dev/october-harness/blob/main/CONTRIBUTING.md).

        Issues that do not meet the quality bar in the contribution guide may be closed with a short explanation.

        Keep this short. If it doesn't fit on one screen, it's too long. Write in your own voice.

        **Important:** before reporting a core issue, validate with `october -ne` that it is not caused by an extension or project configuration.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Be specific. Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Output from `october --version`, or the commit SHA.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, model/provider, and whether October Bus or Desktop is involved.
    validations:
      required: false
